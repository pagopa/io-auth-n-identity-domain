name: Terraform Validation

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - infra/**
      - .terraform-version
      - .pre-commit-config.yaml
      - .trivyignore

jobs:
  tf_analysis:
    # Don't run in Changeset PRs
    if: ${{ github.actor != 'github-actions[bot]' }}
    uses: pagopa/dx/.github/workflows/static_analysis.yaml@723b8233cd9c48bac7cc9e796471d4e12d4f8e5c # main
    name: Terraform Validation
    secrets: inherit
    with:
      enable_modified_files_detection: true
