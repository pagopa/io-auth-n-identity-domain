name: Drift Detection

on:
  workflow_dispatch:
  schedule:
    - cron: "00 06 * * *" # Run at 06:00 (UTC) every day

jobs:
  drift_detection:
    uses: pagopa/dx/.github/workflows/infra_drift_detection.yml@abb37e552370c4b3e2e5b2601c76a307f421c074 # main
    name: Drift Detection
    secrets: inherit
    with:
      environment: prod
      base_path: "infra/resources/"
      override_github_environment: "infra-prod"
      use_private_agent: true
