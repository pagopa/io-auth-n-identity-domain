name: Drift Detection

on:
  workflow_dispatch:
  schedule:
    - cron: "00 06 * * *" # Run at 06:00 (UTC) every day

jobs:
  drift_detection:
    uses: pagopa/dx/.github/workflows/infra_drift_detection.yml@5dd06bf87a5b37b0c1515b8c4891b53445f723c7 # main
    name: Drift Detection
    secrets: inherit
    with:
      environment: prod
      base_path: "infra/resources/"
      override_github_environment: "infra-prod"
      use_private_agent: true
