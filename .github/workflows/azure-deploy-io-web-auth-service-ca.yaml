name: Deploy (io-web-auth-service-ca)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write

jobs:
  release:
    uses: pagopa/dx/.github/workflows/release-azure-containerapp-v1.yaml@main
    name: Deploy
    secrets: inherit
    with:
      dockerfile_path: ./apps/io-web-auth-service/Dockerfile
      dockerfile_context: .
      docker_image_name: pagopa/io-web-auth-service
      docker_image_description: "Microservice that handles IO Web authentication."
      container_app: io-p-itn-ioweb-auth-ca-01
      resource_group_name: io-p-itn-auth-main-rg-01
      environment: app-prod
