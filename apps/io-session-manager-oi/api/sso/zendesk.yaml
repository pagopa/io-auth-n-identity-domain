openapi: 3.1.0
info:
  description: Zendesk SSO endpoints exposed by io-session-manager-oi. Access is restricted to the configured source IP allowlist.
  title: Zendesk API for user authentication.
  version: 0.23.1
servers:
  - url: https://api-app.io.pagopa.it/api/sso/zendesk/v2
tags:
  - name: sso
    description: Zendesk Single Sign-On endpoints.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Enter the opaque token provided by the authentication authority
  schemas:
    ZendeskToken:
      type: object
      properties:
        jwt:
          type: string
          minLength: 1
      required:
        - jwt
      description: A Support Token response to authenticate to Zendesk.
    ProblemDetails:
      type: object
      properties:
        detail:
          type: string
        status:
          type: integer
        title:
          type: string
        type:
          type: string
          format: uri
      required:
        - detail
        - status
        - title
        - type
      description: RFC 7807 Problem Details for HTTP APIs. See https://www.rfc-editor.org/rfc/rfc7807.
    ZendeskTokenRequest:
      type: object
      properties:
        user_token:
          type: string
          minLength: 1
      required:
        - user_token
      description: Request to obtain a Zendesk support token.
  parameters: {}
paths:
  /jwt:
    post:
      description: Returns a JWT with the authenticated user's data for Zendesk. Requests whose source IP is not within the configured allowlist are rejected.
      operationId: getJwtForZendesk
      summary: Get a Zendesk support token
      tags:
        - sso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZendeskTokenRequest"
      responses:
        "200":
          description: Zendesk support token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZendeskToken"
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Missing/invalid user token, unknown session, or source IP blocked by the allowlist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: "Unprocessable Content: the user has an unverified or missing email."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
